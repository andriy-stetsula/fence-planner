<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fence Planner — Map Editor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="toolbar">
    <button data-tool="select" class="tool-btn active" title="V">Select</button>
    <button data-tool="draw" class="tool-btn" title="D">Draw a fence line</button>
    <button data-tool="gap" class="tool-btn" title="Fence gap">Fence gap</button>
    <input id="gap-width-input" type="number" step="0.1" min="0.1" value="1.0" style="width:56px" title="Ширина розриву, м" />
    <button data-tool="gate" class="tool-btn" title="Swing gates">Swing gates</button>
    <input id="gate-width-input" type="number" step="0.1" min="0.1" value="1.2" style="width:56px" title="Ширина воріт, м" />
    <button data-tool="slidingGate" class="tool-btn" title="Sliding gates">Sliding gates</button>
    <input id="sliding-gate-width-input" type="number" step="0.1" min="0.1" placeholder="авто" style="width:64px" title="Точна ширина (SLD-001); порожньо — за двома кліками" />
    <button id="btn-new-run" title="N">New run</button>
    <button id="btn-undo" title="Ctrl+Z">Undo</button>
    <button id="btn-redo" title="Ctrl+Shift+Z">Redo</button>
    <span id="status-text"></span>
  </div>

  <div id="map-wrap">
    <div id="map"></div>
    <!-- SVG overlay, synced 1:1 with the map viewport in overlay.js -->
    <svg id="editor-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <!-- Finish run: fixed corner, per DRW-005 / UI-002, never follows the cursor -->
    <button id="btn-finish-run" class="floating-corner-btn" hidden>Finish run (Enter)</button>
    <!-- length input popover for exact segment length editing (7.3) -->
    <div id="length-popover" class="popover" hidden>
      <input id="length-input" type="number" step="0.1" min="0.1" />
      <span>m</span>
      <button id="length-apply">✓</button>
      <button id="length-close">✕</button>
    </div>
    <!-- joint context panel: lock/unlock, 90°, exact angle (розділ 10, JNT-002) -->
    <div id="joint-popover" class="popover" hidden>
      <button id="joint-90">90°</button>
      <input id="joint-angle-input" type="number" min="1" max="179" step="1" />
      <span>°</span>
      <button id="joint-angle-apply">✓</button>
      <button id="joint-close">✕</button>
    </div>
    <!-- gate arrow controls: only ← → ↑ ↓, no text labels (13.3) -->
    <div id="gate-popover" class="popover gate-popover" hidden>
      <button data-gate-action="hinge-a" title="Петлі: стійка A">←</button>
      <button data-gate-action="hinge-b" title="Петлі: стійка B">→</button>
      <button data-gate-action="swing-left" title="Відкриття: ліворуч">↑</button>
      <button data-gate-action="swing-right" title="Відкриття: праворуч">↓</button>
    </div>
    <!-- sliding gate direction controls: two arrows along the gate axis (SLD-002) -->
    <div id="sliding-gate-popover" class="popover gate-popover" hidden>
      <button data-slide-action="left" title="Полотно йде ліворуч">←</button>
      <button data-slide-action="right" title="Полотно йде праворуч">→</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="src/model.js"></script>
  <script src="src/geo.js"></script>
  <script src="src/history.js"></script>
  <script src="src/state.js"></script>
  <script src="src/draw.js"></script>
  <script src="src/snap.js"></script>
  <script src="src/joint.js"></script>
  <script src="src/gap.js"></script>
  <script src="src/gate.js"></script>
  <script src="src/slidingGate.js"></script>
  <script src="src/select.js"></script>
  <script src="src/overlay.js"></script>
  <script src="src/keyboard.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
